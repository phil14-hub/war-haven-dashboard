name: Synchronize member and leadership portal
on:
  workflow_dispatch:
    inputs:
      archive_day:
        description: UTC backup date to verify (YYYY-MM-DD)
        required: false
        type: string
  push:
    branches: [main]
    paths: [index.html, data/war_tracker_state.enc.json, .github/workflows/sync-portal.yml]
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: war-haven-portal-retry
  cancel-in-progress: false
  queue: single
jobs:
  maintenance:
    if: vars.CLAN_AUTO_UPDATES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clean expired temporary data independently of publication
        run: python github_sync_portal.py --maintenance-only
      - name: Configure encrypted immediate refresh dispatch
        env:
          DASHBOARD_PUBLISH_TOKEN: ${{ secrets.DASHBOARD_PUBLISH_TOKEN }}
        run: python github_dispatch.py
  synchronize:
    concurrency:
      group: war-haven-clan-update
      cancel-in-progress: false
      queue: max
    if: vars.CLAN_AUTO_UPDATES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native archive encryption
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record workflow start
        run: python github_health.py --kind portal --status running
      - name: Publish the saved revision without another clan collection
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          DASHBOARD_PUBLISH_TOKEN: ${{ secrets.DASHBOARD_PUBLISH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python github_sync_portal.py
      - name: Record workflow outcome
        if: always()
        env:
          COLLECTOR_JOB_STATUS: ${{ job.status }}
        run: python github_health.py --kind portal --status "$COLLECTOR_JOB_STATUS"
  backup-clan-archive:
    if: vars.CLAN_AUTO_UPDATES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    concurrency:
      group: war-haven-clan-archive-backup
      cancel-in-progress: false
      queue: single
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native archive encryption
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2
      - name: Verify and save the private daily clan archive backup
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ARCHIVE_DAY: ${{ inputs.archive_day }}
        run: |
          if [ -n "$ARCHIVE_DAY" ]; then
            python github_sync_portal.py --verify-archive-day "$ARCHIVE_DAY"
          elif [ "$EVENT_NAME" = schedule ]; then
            python github_sync_portal.py --backup-clan-archive
          else
            python github_sync_portal.py --verify-clan-archive-backup
          fi
