name: War Haven regression checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '**.py'
      - '**.js'
      - '**.mjs'
      - '**.cjs'
      - '**.json'
      - 'index.html'
      - '.github/workflows/**'
      - 'shared/**'
      - 'templates/**'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject tracked production output
        run: |
          generated=$(git ls-files -- index.html data/war_tracker_state.enc.json)
          if [ -n "$generated" ]; then
            printf 'Production output belongs in R2. Remove these tracked files:\n%s\n' "$generated"
            exit 1
          fi
      - uses: ./.github/actions/check-release
