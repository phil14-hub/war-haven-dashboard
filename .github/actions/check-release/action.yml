name: Verify dashboard release
description: Test the exact source before publishing generated dashboard code.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - name: Install regression dependencies
      shell: bash
      run: |
        python -m pip install --disable-pip-version-check requests==2.34.2
        npm ci --ignore-scripts
    - name: Verify generated portable assets
      shell: bash
      run: python scripts/sync_embedded_assets.py --check
    - name: Run Python regressions
      shell: bash
      run: python -m unittest discover -s tests -v
    - name: Render synthetic leadership fixture
      shell: bash
      run: python tests/create_leadership_fixture.py
    - name: Run all dashboard UI suites
      shell: bash
      env:
        WAR_HAVEN_DASHBOARD_FIXTURE: tests/fixtures/leadership.html
      run: npm run test:ui
