name: Synchronize member and leadership portal
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html, data/war_tracker_state.enc.json]
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: war-haven-clan-update
  cancel-in-progress: false
  queue: max
jobs:
  synchronize:
    if: vars.CLAN_AUTO_UPDATES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record workflow start
        run: python github_health.py --kind portal --status running
      - name: Clean expired temporary data independently of publication
        run: python github_sync_portal.py --maintenance-only
      - name: Publish the saved revision without another clan collection
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          DASHBOARD_PUBLISH_TOKEN: ${{ secrets.DASHBOARD_PUBLISH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python github_sync_portal.py
      - name: Record workflow outcome
        if: always()
        env:
          COLLECTOR_JOB_STATUS: ${{ job.status }}
        run: python github_health.py --kind portal --status "$COLLECTOR_JOB_STATUS"
