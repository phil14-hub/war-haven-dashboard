name: Regenerate Portal Pendant standalone assets (temporary)
on:
  push:
    branches: [fix/portal-pendant-catalog-20261106]
    paths: [.github/workflows/regen-portal-pendant.yml]
permissions:
  contents: write
jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/portal-pendant-catalog-20261106
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate maintained standalone release
        run: |
          python scripts/sync_embedded_assets.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Clash_War_Tracker.py
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate embedded Portal Pendant catalog"
            git push origin HEAD:fix/portal-pendant-catalog-20261106
          fi
