name: Run verified R2 retention once
on:
  push:
    branches: [ops/run-r2-retention]
    paths: [.github/workflows/run-r2-retention.yml]
permissions: {}
jobs:
  dispatch:
    if: github.repository == 'phil14-hub/war-haven-dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Run the current main-branch retention check
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync-portal.yml --repo "$GITHUB_REPOSITORY" --ref main -f storage_retention=true
