name: Apply authorized lossless storage optimization
on:
  push:
    branches: [ops/lossless-storage-apply]
    paths: [.github/workflows/apply-storage-optimization.yml]
permissions:
  contents: read
  actions: write
jobs:
  request-current-main:
    runs-on: ubuntu-latest
    steps:
      - name: Run the verified optimization on current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync-portal.yml --repo phil14-hub/war-haven-dashboard --ref main -f storage_optimization=true
