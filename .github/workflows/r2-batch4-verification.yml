name: Start R2 production workflow verification

on:
  push:
    branches: [ops/r2-batch4-verification]
    paths: [.github/workflows/r2-batch4-verification.yml]

permissions: {}

jobs:
  dispatch:
    if: github.repository == 'phil14-hub/war-haven-dashboard' && vars.CLAN_STORAGE_R2_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Start the live Recruiter scan and code rebuild on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run update-recruitment.yml --repo phil14-hub/war-haven-dashboard --ref main
          gh workflow run rebuild-dashboard.yml --repo phil14-hub/war-haven-dashboard --ref main
