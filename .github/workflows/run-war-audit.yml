name: Dispatch saved final-war audit
on:
  push:
    branches: [ops/run-war-audit]
    paths: [.github/workflows/run-war-audit.yml]
permissions: {}
jobs:
  dispatch:
    if: github.repository == 'phil14-hub/war-haven-dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Request the authenticated read-only audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync-portal.yml --repo "$GITHUB_REPOSITORY" --ref main -f storage_inventory=true -f war_audit=true
