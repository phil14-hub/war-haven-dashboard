name: Deploy encrypted backup page from R2

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact current production R2 release revision
        type: string
        required: true

permissions: {}

concurrency:
  group: war-haven-r2-pages-deploy
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'phil14-hub/war-haven-dashboard' && github.ref == 'refs/heads/main' && vars.CLAN_STORAGE_R2_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package the current encrypted page and verify its revision
        env:
          RELEASE_REVISION: ${{ inputs.revision }}
        run: python github_stage_pages.py "$RUNNER_TEMP/war-haven-pages" --production --revision "$RELEASE_REVISION"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/war-haven-pages
          retention-days: 1
          include-hidden-files: true

  deploy:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm the artifact revision is still current before deploying
        env:
          RELEASE_REVISION: ${{ inputs.revision }}
        run: python github_stage_pages.py --check-current --revision "$RELEASE_REVISION"
      - name: Deploy the verified artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
