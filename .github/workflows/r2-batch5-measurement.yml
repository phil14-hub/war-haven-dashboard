name: Measure and verify production R2 backups
on:
  push:
    branches: [ops/r2-batch5-measurement]
    paths: [.github/workflows/r2-batch5-measurement.yml]
permissions: {}
jobs:
  dispatch:
    if: github.repository == 'phil14-hub/war-haven-dashboard' && vars.CLAN_STORAGE_R2_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Request the inventory and an older archive read-back
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run sync-portal.yml --repo "$GITHUB_REPOSITORY" --ref main -f storage_inventory=true
          gh workflow run sync-portal.yml --repo "$GITHUB_REPOSITORY" --ref main -f archive_day=2026-11-17
