name: War Haven regression checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '**.py'
      - '**.js'
      - '**.mjs'
      - '**.cjs'
      - '**.json'
      - '.github/workflows/**'
      - 'shared/**'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install recruiter regression dependency
        run: python -m pip install --disable-pip-version-check requests==2.34.2
      - run: npm ci --ignore-scripts
      - run: python -m unittest discover -s tests -v
      - name: Generate the synthetic leadership fixture
        run: python tests/create_leadership_fixture.py
      - name: Exercise actual rendered leadership components
        env:
          WAR_HAVEN_DASHBOARD_FIXTURE: tests/fixtures/leadership.html
        run: npm run test:ui
