name: War Haven regression checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '**.py'
      - '**.js'
      - '**.mjs'
      - '**.cjs'
      - '**.json'
      - '!data/war_tracker_state.enc.json'
      - '.github/workflows/**'
      - 'shared/**'
      - 'templates/**'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-release
