name: Password change text alert

on:
  push:
    branches: [main]
    paths:
      - index.html

permissions:
  contents: read

concurrency:
  group: password-change-alert-${{ github.sha }}
  cancel-in-progress: false

jobs:
  text-leader:
    if: vars.PASSWORD_SMS_ENABLED == 'true' && startsWith(github.event.head_commit.message, 'Change dashboard password and re-encrypt saved clan history')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out the password change revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Text the leader after the password change
        env:
          PASSWORD_SMS_ENABLED: ${{ vars.PASSWORD_SMS_ENABLED }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          PASSWORD_ALERT_TO: ${{ secrets.PASSWORD_ALERT_TO }}
        run: python github_password_sms.py
