name: Update clan dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'
      timezone: America/Denver

permissions:
  contents: read
  id-token: write

concurrency:
  group: war-haven-clan-update
  cancel-in-progress: false
  queue: max

jobs:
  setup-needed:
    if: github.event_name == 'workflow_dispatch' && vars.CLAN_AUTO_UPDATES_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain the remaining setup
        run: |
          echo '## Automatic updates need one-time setup' >> "$GITHUB_STEP_SUMMARY"
          echo 'Add the Actions secrets and variables described in AUTOMATIC_UPDATES.md, then run this workflow again.' >> "$GITHUB_STEP_SUMMARY"
          echo '::error::Automatic updates are not enabled. Complete AUTOMATIC_UPDATES.md before running the collector.'
          exit 1
  update:
    # Deliberately off until the owner has configured and approved the API route.
    if: vars.CLAN_AUTO_UPDATES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check collection integrity and portable assets
        run: |
          python scripts/sync_embedded_assets.py --check
          python -m unittest discover -s tests -p test_collection_integrity.py -v
      - name: Record workflow start
        run: python github_health.py --kind clan --status running
      - name: Refresh and publish encrypted clan data
        env:
          COC_API_TOKEN: ${{ secrets.COC_API_TOKEN }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          DASHBOARD_PUBLISH_TOKEN: ${{ secrets.DASHBOARD_PUBLISH_TOKEN }}
          CLAN_API_ROUTE: ${{ vars.CLAN_API_ROUTE }}
        run: python github_collector.py
      - name: Record workflow outcome
        if: always()
        env:
          COLLECTOR_JOB_STATUS: ${{ job.status }}
        run: python github_health.py --kind clan --status "$COLLECTOR_JOB_STATUS"
