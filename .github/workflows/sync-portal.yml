name: Synchronize member and leadership portal
env:
  WAR_HAVEN_CLAN_STORAGE_R2: ${{ github.ref == 'refs/heads/main' && vars.CLAN_STORAGE_R2_ENABLED == 'true' }}
on:
  repository_dispatch:
    types: [war-haven-r2-password]
  workflow_dispatch:
    inputs:
      storage_optimization:
        description: Verify recovery points and apply lossless publication and archive compression
        type: boolean
        default: false
      storage_retention:
        description: Verify recovery points and compact unreferenced production storage
        type: boolean
        default: false
      storage_inventory:
        description: Report production backup object counts and bytes without changing storage
        type: boolean
        default: false
      war_audit:
        description: Include an aggregate final-war audit in the read-only inventory run
        type: boolean
        default: false
      seed_r2_revision:
        description: Full pinned main commit to seed into empty production R2 storage
        required: false
        type: string
      archive_day:
        description: UTC backup date to verify (YYYY-MM-DD)
        required: false
        type: string
      staging:
        description: Seed, verify, or back up the isolated R2 staging release
        type: choice
        default: 'off'
        options: ['off', seed, verify, daily-backup]
  push:
    branches: [main]
    paths: [index.html, data/war_tracker_state.enc.json, .github/workflows/sync-portal.yml]
  schedule:
    - cron: '17,47 * * * *'
    - cron: '8 17 * * *'
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: war-haven-portal-retry
  cancel-in-progress: false
  queue: single
jobs:
  storage-optimization:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.storage_optimization == true && vars.CLAN_STORAGE_R2_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: war-haven-clan-update
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install archive verification
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2
      - name: Verify every retained recovery point and optimize without losing logical data
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: python -m scripts.optimize_storage
      - name: Reconcile Pages and portal publication for the verified release
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          DASHBOARD_PUBLISH_TOKEN: ${{ secrets.DASHBOARD_PUBLISH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python github_sync_portal.py
  storage-inventory:
    if: inputs.storage_optimization != true && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.storage_inventory == true && vars.CLAN_STORAGE_R2_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: war-haven-clan-update
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read the R2 backup inventory
        run: |
          python - <<'PY'
          import json
          from shared_actions import CLAN_STORAGE_PATH, Client
          result = Client('').request(CLAN_STORAGE_PATH + '?inventory=1', method='GET')
          print(json.dumps(result, indent=2))
          PY

      - name: Audit saved final-war status
        if: inputs.war_audit == true
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          python -m pip install --disable-pip-version-check cryptography==50.0.2
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from clan_storage import StagedClanStorage
          from github_collector import load_tracker
          from war_end_updates import timestamp
          from shared_actions import CLAN_STORAGE_PATH, Client
          from scripts.audit_storage import summarize
          index, _, state = StagedClanStorage(production=True).restore(load_tracker(), os.environ['DASHBOARD_PASSWORD'])
          now = datetime.now(timezone.utc)
          recent = sorted(state.get('wars', []), key=lambda war: war.get('endTime') or '')[-10:]
          fields = ('kind', 'source', 'state', 'endTime', 'observedAt', 'teamSize',
                    'final', 'rosterComplete', 'reportedAttacks', 'stars', 'opponentStars', 'expEarned', 'captureIssues')
          def row(war):
              row = {field: war.get(field) for field in fields}
              row.update(participants=len(war.get('participants') or []),
                         pending=not war.get('final') and (timestamp(war.get('endTime')) or now) <= now,
                         completedWatch=bool(state.get('automaticUpdates', {}).get('postWar', {}).get('watches', {}).get(war.get('id'), {}).get('completedAt')))
              return row
          affected = [war for war in state.get('wars', [])
                      if war.get('kind') in ('Regular', 'CWL') and not war.get('final')
                      and (timestamp(state.get('policyStart')) or now) <= (timestamp(war.get('endTime')) or now) <= now]
          print(json.dumps({'revision': index['revision'], 'policyStart': state.get('policyStart'),
                            'recent': [row(war) for war in recent], 'incompleteTracked': [row(war) for war in affected]}))
          delivery = Client('').request('/members/api/publication-source', {'read': True}).get('source') or {}
          delivery_verified = (delivery.get('r2Revision') == index['revision'] and
                               delivery.get('historySha') == index['archive']['sha256'] and
                               delivery.get('pageSha') == index['page']['sha256'] and delivery.get('pagesConfirmed') is True)
          if not delivery_verified:
              raise ValueError('The current release does not have matching portal and confirmed Pages delivery.')
          print(json.dumps({'deliveryVerification': {'verified': True, 'revision': index['revision'],
                                                     'publication': delivery.get('publication'), 'pagesConfirmed': True}}))
          print(json.dumps({'archiveStorageAudit': summarize(state)}))
          print(json.dumps({'websiteStorageAudit': Client('').request(CLAN_STORAGE_PATH + '?inventory=2', method='GET')}))
          PY

  maintenance:
    if: inputs.storage_optimization != true && inputs.storage_retention != true && inputs.storage_inventory != true && vars.CLAN_AUTO_UPDATES_ENABLED == 'true' && github.event_name != 'repository_dispatch' && github.event.schedule != '8 17 * * *' && (!inputs.staging || inputs.staging == 'off') && !inputs.seed_r2_revision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clean expired temporary data independently of publication
        run: python github_sync_portal.py --maintenance-only
      - name: Configure encrypted immediate refresh dispatch
        env:
          DASHBOARD_PUBLISH_TOKEN: ${{ secrets.DASHBOARD_PUBLISH_TOKEN }}
        run: python github_dispatch.py
  synchronize:
    concurrency:
      group: war-haven-clan-update
      cancel-in-progress: false
      queue: max
    if: inputs.storage_optimization != true && inputs.storage_retention != true && inputs.storage_inventory != true && vars.CLAN_AUTO_UPDATES_ENABLED == 'true' && (github.event_name != 'repository_dispatch' || vars.CLAN_STORAGE_R2_ENABLED == 'true') && github.event.schedule != '8 17 * * *' && (!inputs.staging || inputs.staging == 'off') && !inputs.seed_r2_revision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native archive encryption
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record workflow start
        run: python github_health.py --kind portal --status running
      - name: Publish the saved revision without another clan collection
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          DASHBOARD_PUBLISH_TOKEN: ${{ secrets.DASHBOARD_PUBLISH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python github_sync_portal.py
      - name: Record workflow outcome
        if: always()
        env:
          COLLECTOR_JOB_STATUS: ${{ job.status }}
        run: python github_health.py --kind portal --status "$COLLECTOR_JOB_STATUS"
  backup-clan-archive:
    if: inputs.storage_optimization != true && inputs.storage_retention != true && inputs.storage_inventory != true && vars.CLAN_AUTO_UPDATES_ENABLED == 'true' && github.event_name != 'repository_dispatch' && (github.event_name != 'schedule' || github.event.schedule == '8 17 * * *') && (!inputs.staging || inputs.staging == 'off') && !inputs.seed_r2_revision
    runs-on: ubuntu-latest
    timeout-minutes: 7
    concurrency:
      group: war-haven-clan-archive-backup
      cancel-in-progress: false
      queue: single
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native archive encryption
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2
      - name: Verify and save the private daily clan archive backup
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ARCHIVE_DAY: ${{ inputs.archive_day }}
        run: |
          if [ -n "$ARCHIVE_DAY" ]; then
            python github_sync_portal.py --verify-archive-day "$ARCHIVE_DAY"
          elif [ "$EVENT_NAME" = schedule ]; then
            python github_sync_portal.py --backup-clan-archive
          else
            python github_sync_portal.py --verify-clan-archive-backup
          fi
  storage-retention:
    needs: backup-clan-archive
    if: >-
      always() && inputs.storage_optimization != true && github.ref == 'refs/heads/main' && vars.CLAN_STORAGE_R2_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && inputs.storage_retention == true && inputs.storage_inventory != true) ||
       (github.event_name == 'schedule' && github.event.schedule == '8 17 * * *' && needs.backup-clan-archive.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: war-haven-clan-update
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install archive verification
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2
      - name: Verify recovery, compact storage, and prove an identical retry adds no objects
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from scripts.audit_storage import summarize
          from clan_storage import StagedClanStorage, verified_state
          from github_collector import load_tracker
          from github_sync_portal import read_clan_archive_backup
          from shared_actions import CLAN_STORAGE_PATH, Client
          from war_end_updates import timestamp
          client = Client('')
          storage = StagedClanStorage(client, production=True)
          tracker = load_tracker()
          password = os.environ['DASHBOARD_PASSWORD']
          before = client.request(CLAN_STORAGE_PATH + '?inventory=1', method='GET')
          plan = client.request(CLAN_STORAGE_PATH + '?retention=1', method='GET')
          index, archive, state = storage.restore(tracker, password)
          page = storage.read('page', index)
          if index['revision'] != plan['revision']:
              raise ValueError('The current release changed before retention.')
          if index.get('previousRevision'):
              previous = storage.release(index['previousRevision'])
              verified_state(storage.read('archive', previous), tracker, storage.release_password(previous, password))
              storage.read('page', previous)
          config = {'password': password}
          def restore_days():
              return {day: hashlib.sha256(read_clan_archive_backup(config, tracker, client, day, production=True)).hexdigest()
                      for day in plan['dailyDays']}
          daily_before = restore_days()
          result = client.request(CLAN_STORAGE_PATH + '?retention=1&revision=' + index['revision'], method='POST')
          if restore_days() != daily_before:
              raise ValueError('Daily archive restoration changed after retention.')
          after_index, after_archive, _ = storage.restore(tracker, password)
          if after_index != index or after_archive != archive or storage.read('page', index) != page:
              raise ValueError('The current release changed during retention.')
          before_retry = client.request(CLAN_STORAGE_PATH + '?inventory=1', method='GET')
          retry = storage.store(index, index['source'], timestamp(index['nextWarUpdateAt']), archive, page)
          after = client.request(CLAN_STORAGE_PATH + '?inventory=1', method='GET')
          for group in ('productionArchive', 'productionPages', 'productionReleases'):
              if after['groups'][group] != before_retry['groups'][group]:
                  raise ValueError('An identical retry added stored release objects.')
          if retry != index:
              raise ValueError('An identical retry changed the release.')
          print(json.dumps({'archiveStorageAudit': summarize(state), 'websiteStorageAudit': client.request(CLAN_STORAGE_PATH + '?inventory=2', method='GET')}))
          print(json.dumps({'before': before, 'plan': plan, 'applied': result, 'after': after,
                            'restoredDailyDates': sorted(daily_before), 'identicalRetryAddedLargeObjects': 0}))
          PY
  seed-production:
    if: inputs.storage_optimization != true && inputs.storage_retention != true && inputs.storage_inventory != true && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.seed_r2_revision && (!inputs.staging || inputs.staging == 'off') && vars.CLAN_STORAGE_R2_ENABLED != 'true'
    concurrency:
      group: war-haven-clan-update
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native archive encryption
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2
      - name: Verify and seed the exact Git checkpoint without switching the collectors
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
          CHECKPOINT: ${{ inputs.seed_r2_revision }}
        run: python github_sync_portal.py --seed-r2-production "$CHECKPOINT"
  staging:
    if: inputs.storage_optimization != true && inputs.storage_retention != true && inputs.storage_inventory != true && github.event_name == 'workflow_dispatch' && (inputs.staging == 'seed' || inputs.staging == 'verify' || inputs.staging == 'daily-backup') && !inputs.seed_r2_revision
    concurrency:
      group: war-haven-clan-update
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native archive encryption
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated storage without updating the live portal
        env:
          WAR_HAVEN_CLAN_STORAGE_STAGE: 'true'
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
          STAGING_MODE: ${{ inputs.staging }}
          ARCHIVE_DAY: ${{ inputs.archive_day }}
        run: |
          case "$STAGING_MODE" in
            seed) python github_sync_portal.py --seed-r2-staging ;;
            verify) python github_sync_portal.py ;;
            daily-backup)
              if [ -n "$ARCHIVE_DAY" ]; then
                python github_sync_portal.py --verify-archive-day "$ARCHIVE_DAY"
              else
                python github_sync_portal.py --verify-clan-archive-backup
              fi ;;
          esac
