name: Publish dashboard code from saved history
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Clash_War_Tracker.py
      - tracker_core.py
      - publication_sync.py
      - shared/**
      - templates/**
      - shared_dashboard.js
      - live_dashboard.js
      - member_accounts.js
      - recruitment_dashboard.js
      - recruitment_contacts.js
      - recruitment_dashboard.css
      - upgrade_progress.py
      - upgrade_catalog.json
      - github_dispatch.py
      - github_render_dashboard.py
      - member_exports.py
      - snapshot_audit.py
      - .github/workflows/rebuild-dashboard.yml
      - .github/actions/**
      - scripts/**
      - package.json
      - package-lock.json
permissions:
  contents: read
  id-token: write
concurrency:
  group: war-haven-code-rebuild
  cancel-in-progress: false
  queue: single
jobs:
  verify:
    if: vars.CLAN_AUTO_UPDATES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the exact release source outside the collection queue
        uses: ./.github/actions/check-release
  publish-code:
    needs: verify
    concurrency:
      group: war-haven-clan-update
      cancel-in-progress: false
      queue: max
    if: vars.CLAN_AUTO_UPDATES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record workflow start
        run: python github_health.py --kind code --status running
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native archive encryption
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2
      - name: Configure encrypted immediate refresh dispatch
        env:
          DASHBOARD_PUBLISH_TOKEN: ${{ secrets.DASHBOARD_PUBLISH_TOKEN }}
        run: python github_dispatch.py
      - name: Rebuild over the verified archive and publish matching projections
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          DASHBOARD_PUBLISH_TOKEN: ${{ secrets.DASHBOARD_PUBLISH_TOKEN }}
        run: python github_render_dashboard.py
      - name: Verify immediate refresh dispatch after publishing
        run: python github_dispatch.py --verify
      - name: Record workflow outcome
        if: always()
        env:
          COLLECTOR_JOB_STATUS: ${{ job.status }}
        run: python github_health.py --kind code --status "$COLLECTOR_JOB_STATUS"
